name: Build FPSRAM dylib

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile dylib
        run: |
          set -o pipefail
          ls -la
          xcrun --sdk iphoneos clang -arch arm64 \
            -miphoneos-version-min=13.0 \
            -fobjc-arc -dynamiclib \
            -Wno-deprecated-declarations \
            -framework Foundation -framework CoreFoundation \
            -framework CoreGraphics -framework UIKit -framework QuartzCore \
            -install_name @executable_path/Frameworks/FPSRAM.dylib \
            -o FPSRAM.dylib FPSRAMOverlay.m 2>&1 | tee build.log
          ls -la FPSRAM.dylib

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FPSRAM-dylib
          path: |
            FPSRAM.dylib
            build.log
